    <!-- Base JSON-LD Structured Data for Initial Crawl -->
    <script id="easyui-seo-jsonld" type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "EasyUI",
          "url": "https://easyui.site",
          "description": "Production-ready, beautifully crafted animated UI components built with React, Tailwind CSS, and Framer Motion for modern web applications.",
          "inLanguage": "en-US",
          "author": {
            "@type": "Person",
            "name": "Suraj Maurya",
            "url": "https://github.com/Surajmaurya1/easyui"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://easyui.site/components?search={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "name": "EasyUI",
          "url": "https://easyui.site",
          "logo": "https://easyui.site/logo.png",
          "sameAs": [
            "https://github.com/Surajmaurya1/easyui"
          ],
          "founder": {
            "@type": "Person",
            "name": "Suraj Maurya"
          }
        }
      ]
    }
